name: mirror-claude-vm-v2
on:
  workflow_dispatch:
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Probe and download vmlinuz/initrd
        run: |
          mkdir -p out
          BASE="https://downloads.claude.ai/vms/linux/x64/072b6cbfe74f428a98bd86035f83b322b369d1f1"
          for f in vmlinuz.zst initrd.zst initrd-micro.zst; do
            code=$(curl -sSL -f -o "out/$f" -w "%{http_code}" "$BASE/$f" || echo FAIL)
            echo "$f -> $code $(stat -c%s out/$f 2>/dev/null)"
          done
          sha256sum out/* | tee hashes.txt
          echo "expected vmlinuz.zst: 3118616ef6ba3866652284b8b4c224a96876c56091724c35c93caf1ccb9b50a9 (14758684 bytes)"
          echo "expected initrd.zst: e3c5ce2b8e9e9adf67de7ec83cafa4a0c65fab8a22036a6b53f03c9765b3342a (28024101 bytes)"

      - name: Upload to existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload claude-vm-072b6cbf out/* --clobber --repo "${{ github.repository }}"
          echo uploaded
